<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thanks for celebrating Steve Hartnett's 80th birthday. Share your photos from the party!">
  <meta name="theme-color" content="#2D5F3C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Steve Hartnett — Thanks &amp; Photos</title>
  <link rel="icon" type="image/png" href="steve.jpg">
  <link rel="apple-touch-icon" href="steve.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>

    <!-- ===================== HERO ===================== -->
    <section class="hero" style="padding-bottom:var(--sp7)">
      <div class="container">
        <div class="hero-grid">
          <div class="hero-photo">
            <img src="steve.jpg" alt="Steve Hartnett">
          </div>
          <div class="hero-content">
            <div class="hero-age" aria-hidden="true">Thanks.</div>
            <p class="hero-meta">What a great party.</p>
            <div class="hero-btns">
              <a href="#share-photos" class="btn-hero-cta">Share Photos &rarr;</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="rule-black"></div>

    <!-- ===================== SHARE PHOTOS ===================== -->
    <section class="photos-section" id="share-photos">
      <div class="container">
        <div class="section-label-row">
          <span class="section-label">Share Your Photos</span>
          <div class="label-rule"></div>
        </div>
        <a class="btn-hero-cta"
          href="https://drive.google.com/drive/folders/1wbHJTkfopiT-vVMzN_qJl5E62a3hxPLK"
          target="_blank" rel="noopener">
          Share Photos on Google Drive &rarr;
        </a>
      </div>
    </section>


    <div class="rule-black"></div>

  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container">
      <p class="footer-title">Steve Hartnett's 80th Birthday &mdash; April 30, 2026</p>
    </div>
  </footer>


</body>
</html>
